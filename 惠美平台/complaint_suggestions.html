<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投诉建议 - 惠美平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #ff4466;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .form-container {
            margin: 40px 0;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff4466;
            box-shadow: 0 0 0 3px rgba(255, 68, 102, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .submit-button {
            text-align: center;
            margin-top: 40px;
        }
        
        .submit-button button {
            background: linear-gradient(135deg, #ff4466, #ff6b6b);
            color: #fff;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 68, 102, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .submit-button button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 68, 102, 0.4);
        }
        
        .suggestion-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        .type-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            border-top: 4px solid #ff4466;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .type-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .type-card h3 {
            color: #ff4466;
            margin-bottom: 10px;
        }
        
        .type-card p {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 投诉建议</h1>
            <p>欢迎提出您的宝贵意见</p>
        </div>
        
        <div class="suggestion-types">
            <div class="type-card">
                <h3>💬 商品问题</h3>
                <p>对购买的商品有任何不满意或质量问题？</p>
            </div>
            <div class="type-card">
                <h3>⚡ 服务问题</h3>
                <p>对我们的服务体验有意见建议？</p>
            </div>
            <div class="type-card">
                <h3>🎯 功能建议</h3>
                <p>对网站功能有新的想法或改进建议？</p>
            </div>
        </div>
        
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 30px; color: #333;">填写投诉建议</h2>
            <form id="suggestionForm">
                <div class="form-group">
                    <label for="type">类型</label>
                    <select id="type" name="type">
                        <option value="">请选择类型</option>
                        <option value="商品问题">商品问题</option>
                        <option value="服务问题">服务问题</option>
                        <option value="功能建议">功能建议</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="contact">联系方式</label>
                    <input type="text" id="contact" name="contact" placeholder="请输入您的手机号或邮箱">
                </div>
                <div class="form-group">
                    <label for="title">标题</label>
                    <input type="text" id="title" name="title" placeholder="请输入标题">
                </div>
                <div class="form-group">
                    <label for="content">详细内容</label>
                    <textarea id="content" name="content" placeholder="请详细描述您的问题或建议"></textarea>
                </div>
                <div class="submit-button">
                    <button type="submit">提交</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('suggestionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const contact = document.getElementById('contact').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            if (!type || !contact || !title || !content) {
                alert('请填写完整信息');
            } else {
                alert('感谢您的反馈！我们将认真处理您的意见建议，并尽快与您联系。');
                this.reset();
            }
        });
    </script>
</body>
</html>
