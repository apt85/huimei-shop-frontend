<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惠美平台 - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft Yahei", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* 轮播图区域 */
        .slider-container {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .slider {
            display: flex;
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            position: relative;
        }
        .slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slider-content {
            position: absolute;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .slider-content h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .slider-content p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        /* 特色栏目 */
        .featured-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .featured-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .featured-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .featured-card h3 {
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        .featured-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            object-fit: cover;
            border-radius: 4px;
        }
        /* 分类区域 */
        .categories {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .categories h2 {
            margin-bottom: 20px;
            color: #ff4466;
            font-size: 2em;
            text-align: center;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .category-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .category-item:hover {
            background: #e9ecef;
        }
        /* 轮播图指示器 */
        .slider-dots {
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.9);
        }
        .dot {
            height: 8px;
            width: 8px;
            margin: 0 4px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
        }
        .dot.active {
            background-color: #ff4466;
        }
        /* 响应式设计 */
        @media (max-width: 768px) {
            .slider {
                height: 250px;
            }
            .slider-content h1 {
                font-size: 2em;
            }
            .slider-content p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 轮播图 -->
        <div class="slider-container">

                <div class="slider-content">

        <!-- 商品分类 -->

        </div>
    </div>
</body>
