<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>鞋子分类 - 惠美平台</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: 'Microsoft YaHei', Arial, sans-serif;
				background-color: #f8f8f8;
				color: #333;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}
			.page-header {
				background: linear-gradient(135deg, #4488ff 0%, #66aaff 100%);
				color: white;
				padding: 30px 0;
				text-align: center;
				margin-bottom: 30px;
				border-radius: 8px;
			}
			.page-header h1 {
				font-size: 32px;
				margin-bottom: 10px;
			}
			.page-header p {
				font-size: 16px;
				opacity: 0.9;
			}
			.product-section {
				margin-bottom: 40px;
			}
			.section-title {
				font-size: 24px;
				color: #333;
				margin-bottom: 20px;
				padding-bottom: 10px;
				border-bottom: 2px solid #4488ff;
			}
			.product-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 20px;
			}
			.product-card {
				background: white;
				border-radius: 8px;
				padding: 20px;
				box-shadow: 0 2px 8px rgba(0,0,0,0.1);
				transition: all 0.3s ease;
			}
			.product-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 5px 15px rgba(0,0,0,0.15);
			}
			.product-image {
				width: 100%;
				height: 200px;
				border-radius: 6px;
				margin-bottom: 15px;
				object-fit: cover;
			}
			.product-name {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 10px;
				color: #333;
			}
			.product-desc {
				font-size: 14px;
				color: #666;
				margin-bottom: 15px;
				line-height: 1.5;
			}
			.product-price {
				font-size: 22px;
				color: #4488ff;
				font-weight: bold;
			}
			.product-price span {
				font-size: 14px;
				color: #999;
				text-decoration: line-through;
				margin-left: 10px;
			}
			.promotion-banner {
				background: linear-gradient(45deg, #4488ff, #88ccff);
				color: white;
				padding: 20px;
				border-radius: 8px;
				margin-bottom: 30px;
			}
			.promotion-banner h3 {
				margin-bottom: 10px;
			}
			.btn {
				display: inline-block;
				padding: 10px 20px;
				background-color: #4488ff;
				color: white;
				text-decoration: none;
				border-radius: 4px;
				transition: background-color 0.3s ease;
			}
			.btn:hover {
				background-color: #3377ee;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="page-header">
				<h1>👟 鞋子分类</h1>
				<p>精选鞋款，舒适时尚，品质保障</p>
			</div>

			<div class="promotion-banner">
				<h3>👟 鞋类特惠</h3>
				<p>全场鞋类5折起，满300减50，满500减100！</p>
				<a href="#" class="btn">立即抢购</a>
			</div>

			<div class="product-section">
				<h2 class="section-title">热门鞋款</h2>
				<div class="product-grid">
					<div class="product-card">
						<img src="https://picsum.photos/400/300?shoes=1" alt="时尚运动鞋" class="product-image">
						<div class="product-name">时尚运动鞋</div>
						<div class="product-desc">舒适缓震，时尚百搭，适合日常穿着</div>
						<div class="product-price">¥599 <span>¥899</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/400/300?shoes=2" alt="商务皮鞋" class="product-image">
						<div class="product-name">商务皮鞋</div>
						<div class="product-desc">真皮材质，手工制作，经典款式</div>
						<div class="product-price">¥799 <span>¥1199</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/400/300?shoes=3" alt="休闲板鞋" class="product-image">
						<div class="product-name">休闲板鞋</div>
						<div class="product-desc">时尚设计，舒适透气，街头潮款</div>
						<div class="product-price">¥399 <span>¥599</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/400/300?shoes=4" alt="女士高跟鞋" class="product-image">
						<div class="product-name">女士高跟鞋</div>
						<div class="product-desc">优雅设计，高度适中，舒适耐穿</div>
						<div class="product-price">¥499 <span>¥799</span></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
