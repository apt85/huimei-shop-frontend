<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>家居分类 - 惠美平台</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: 'Microsoft YaHei', Arial, sans-serif;
				background-color: #f8f8f8;
				color: #333;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}
			.page-header {
				background: linear-gradient(135deg, #66cc66 0%, #88dd88 100%);
				color: white;
				padding: 30px 0;
				text-align: center;
				margin-bottom: 30px;
				border-radius: 8px;
			}
			.page-header h1 {
				font-size: 32px;
				margin-bottom: 10px;
			}
			.page-header p {
				font-size: 16px;
				opacity: 0.9;
			}
			.product-section {
				margin-bottom: 40px;
			}
			.section-title {
				font-size: 24px;
				color: #333;
				margin-bottom: 20px;
				padding-bottom: 10px;
				border-bottom: 2px solid #66cc66;
			}
			.product-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 20px;
			}
			.product-card {
				background: white;
				border-radius: 8px;
				padding: 20px;
				box-shadow: 0 2px 8px rgba(0,0,0,0.1);
				transition: all 0.3s ease;
			}
			.product-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 5px 15px rgba(0,0,0,0.15);
			}
			.product-image {
				width: 100%;
				height: 200px;
				border-radius: 6px;
				margin-bottom: 15px;
				object-fit: cover;
			}
			.product-name {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 10px;
				color: #333;
			}
			.product-desc {
				font-size: 14px;
				color: #666;
				margin-bottom: 15px;
				line-height: 1.5;
			}
			.product-price {
				font-size: 22px;
				color: #66cc66;
				font-weight: bold;
			}
			.product-price span {
				font-size: 14px;
				color: #999;
				text-decoration: line-through;
				margin-left: 10px;
			}
			.promotion-banner {
				background: linear-gradient(45deg, #66cc66, #aaddaa);
				color: white;
				padding: 20px;
				border-radius: 8px;
				margin-bottom: 30px;
			}
			.promotion-banner h3 {
				margin-bottom: 10px;
			}
			.btn {
				display: inline-block;
				padding: 10px 20px;
				background-color: #66cc66;
				color: white;
				text-decoration: none;
				border-radius: 4px;
				transition: background-color 0.3s ease;
			}
			.btn:hover {
				background-color: #55bb55;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="page-header">
				<h1>🏠 家居分类</h1>
				<p>温馨家居，舒适生活，品质之选</p>
			</div>

			<div class="promotion-banner">
				<h3>🏡 家居特惠</h3>
				<p>全场家居5折起，满500减80，满1000减200！</p>
				<a href="#" class="btn">立即抢购</a>
			</div>

			<div class="product-section">
				<h2 class="section-title">热门家居</h2>
				<div class="product-grid">
					<div class="product-card">
						<img src="../slideshow/images/furniture_1.jpg" alt="现代布艺沙发" class="product-image">
						<div class="product-name">现代布艺沙发</div>
						<div class="product-desc">舒适柔软，现代简约，客厅必备</div>
						<div class="product-price">¥2999 <span>¥4999</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/furniture_2.jpg" alt="实木茶几" class="product-image">
						<div class="product-name">实木茶几</div>
						<div class="product-desc">天然实木，环保健康，质感上乘</div>
						<div class="product-price">¥1599 <span>¥2599</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/furniture_3.jpg" alt="舒适床垫" class="product-image">
						<div class="product-name">舒适床垫</div>
						<div class="product-desc">独立弹簧，透气舒适，优质睡眠</div>
						<div class="product-price">¥1999 <span>¥3999</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/furniture_4.jpg" alt="北欧风格椅子" class="product-image">
						<div class="product-name">北欧风格椅子</div>
						<div class="product-desc">简约时尚，舒适耐用，百搭之选</div>
						<div class="product-price">¥899 <span>¥1299</span></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
