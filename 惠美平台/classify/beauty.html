<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>美妆分类 - 惠美平台</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: 'Microsoft YaHei', Arial, sans-serif;
				background-color: #f8f8f8;
				color: #333;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}
			.page-header {
				background: linear-gradient(135deg, #ff66aa 0%, #ff88cc 100%);
				color: white;
				padding: 30px 0;
				text-align: center;
				margin-bottom: 30px;
				border-radius: 8px;
			}
			.page-header h1 {
				font-size: 32px;
				margin-bottom: 10px;
			}
			.page-header p {
				font-size: 16px;
				opacity: 0.9;
			}
			.product-section {
				margin-bottom: 40px;
			}
			.section-title {
				font-size: 24px;
				color: #333;
				margin-bottom: 20px;
				padding-bottom: 10px;
				border-bottom: 2px solid #ff66aa;
			}
			.product-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 20px;
			}
			.product-card {
				background: white;
				border-radius: 8px;
				padding: 20px;
				box-shadow: 0 2px 8px rgba(0,0,0,0.1);
				transition: all 0.3s ease;
			}
			.product-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 5px 15px rgba(0,0,0,0.15);
			}
			.product-image {
				width: 100%;
				height: 200px;
				border-radius: 6px;
				margin-bottom: 15px;
				object-fit: cover;
			}
			.product-name {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 10px;
				color: #333;
			}
			.product-desc {
				font-size: 14px;
				color: #666;
				margin-bottom: 15px;
				line-height: 1.5;
			}
			.product-price {
				font-size: 22px;
				color: #ff66aa;
				font-weight: bold;
			}
			.product-price span {
				font-size: 14px;
				color: #999;
				text-decoration: line-through;
				margin-left: 10px;
			}
			.promotion-banner {
				background: linear-gradient(45deg, #ff66aa, #ff99dd);
				color: white;
				padding: 20px;
				border-radius: 8px;
				margin-bottom: 30px;
			}
			.promotion-banner h3 {
				margin-bottom: 10px;
			}
			.btn {
				display: inline-block;
				padding: 10px 20px;
				background-color: #ff66aa;
				color: white;
				text-decoration: none;
				border-radius: 4px;
				transition: background-color 0.3s ease;
			}
			.btn:hover {
				background-color: #ee5599;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="page-header">
				<h1>💄 美妆分类</h1>
				<p>品质美妆，呵护肌肤，展现美丽</p>
			</div>

			<div class="promotion-banner">
				<h3>✨ 美妆大促</h3>
				<p>全场美妆4折起，满200减40，满500减120！</p>
				<a href="#" class="btn">立即抢购</a>
			</div>

			<div class="product-section">
				<h2 class="section-title">热门美妆</h2>
				<div class="product-grid">
					<div class="product-card">
						<img src="https://picsum.photos/400/300?beauty=1" alt="护肤套装" class="product-image">
						<div class="product-name">护肤套装</div>
						<div class="product-desc">深层滋养，提亮肤色，细致呵护</div>
						<div class="product-price">¥699 <span>¥999</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/400/300?beauty=2" alt="口红套装" class="product-image">
						<div class="product-name">口红套装</div>
						<div class="product-desc">多色可选，持久不掉色，滋润护唇</div>
						<div class="product-price">¥399 <span>¥599</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/400/300?beauty=3" alt="粉底液" class="product-image">
						<div class="product-name">粉底液</div>
						<div class="product-desc">轻薄透气，持久遮瑕，自然裸妆</div>
						<div class="product-price">¥299 <span>¥499</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/400/300?beauty=4" alt="面膜套装" class="product-image">
						<div class="product-name">面膜套装</div>
						<div class="product-desc">补水保湿，紧致肌肤，每周护理必备</div>
						<div class="product-price">¥499 <span>¥799</span></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
