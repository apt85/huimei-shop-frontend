<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>数码分类 - 惠美平台</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: 'Microsoft YaHei', Arial, sans-serif;
				background-color: #f8f8f8;
				color: #333;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}
			.page-header {
				background: linear-gradient(135deg, #44bbff 0%, #66ccff 100%);
				color: white;
				padding: 30px 0;
				text-align: center;
				margin-bottom: 30px;
				border-radius: 8px;
			}
			.page-header h1 {
				font-size: 32px;
				margin-bottom: 10px;
			}
			.page-header p {
				font-size: 16px;
				opacity: 0.9;
			}
			.product-section {
				margin-bottom: 40px;
			}
			.section-title {
				font-size: 24px;
				color: #333;
				margin-bottom: 20px;
				padding-bottom: 10px;
				border-bottom: 2px solid #44bbff;
			}
			.product-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 20px;
			}
			.product-card {
				background: white;
				border-radius: 8px;
				padding: 20px;
				box-shadow: 0 2px 8px rgba(0,0,0,0.1);
				transition: all 0.3s ease;
			}
			.product-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 5px 15px rgba(0,0,0,0.15);
			}
			.product-image {
				width: 100%;
				height: 200px;
				border-radius: 6px;
				margin-bottom: 15px;
				object-fit: cover;
			}
			.product-name {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 10px;
				color: #333;
			}
			.product-desc {
				font-size: 14px;
				color: #666;
				margin-bottom: 15px;
				line-height: 1.5;
			}
			.product-price {
				font-size: 22px;
				color: #44bbff;
				font-weight: bold;
			}
			.product-price span {
				font-size: 14px;
				color: #999;
				text-decoration: line-through;
				margin-left: 10px;
			}
			.promotion-banner {
				background: linear-gradient(45deg, #44bbff, #88ddff);
				color: white;
				padding: 20px;
				border-radius: 8px;
				margin-bottom: 30px;
			}
			.promotion-banner h3 {
				margin-bottom: 10px;
			}
			.btn {
				display: inline-block;
				padding: 10px 20px;
				background-color: #44bbff;
				color: white;
				text-decoration: none;
				border-radius: 4px;
				transition: background-color 0.3s ease;
			}
			.btn:hover {
				background-color: #33aaff;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="page-header">
				<h1>📱 数码分类</h1>
				<p>前沿数码，智能科技，品质之选</p>
			</div>

			<div class="promotion-banner">
				<h3>⚡ 数码特惠</h3>
				<p>全场数码5折起，满1000减100，满2000减300！</p>
				<a href="#" class="btn">立即抢购</a>
			</div>

			<div class="product-section">
				<h2 class="section-title">热门数码</h2>
				<div class="product-grid">
					<div class="product-card">
						<img src="../slideshow/images/numericalcode_1.jpg" alt="智能手机" class="product-image">
						<div class="product-name">智能手机</div>
						<div class="product-desc">最新款旗舰手机，高性能处理器，超大内存</div>
						<div class="product-price">¥3999 <span>¥5999</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/numericalcode_2.jpg" alt="笔记本电脑" class="product-image">
						<div class="product-name">笔记本电脑</div>
						<div class="product-desc">轻薄便携，强劲性能，办公娱乐两不误</div>
						<div class="product-price">¥5999 <span>¥7999</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/numericalcode_3.jpg" alt="平板电脑" class="product-image">
						<div class="product-name">平板电脑</div>
						<div class="product-desc">高清屏幕，超长续航，学习娱乐多用途</div>
						<div class="product-price">¥2999 <span>¥4999</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/numericalcode_4.jpg" alt="无线耳机" class="product-image">
						<div class="product-name">无线耳机</div>
						<div class="product-desc">主动降噪，音质清晰，蓝牙5.0稳定连接</div>
						<div class="product-price">¥899 <span>¥1299</span></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
