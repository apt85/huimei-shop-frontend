<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>图书分类 - 惠美平台</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: 'Microsoft YaHei', Arial, sans-serif;
				background-color: #f8f8f8;
				color: #333;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}
			.page-header {
				background: linear-gradient(135deg, #4466aa 0%, #7788cc 100%);
				color: white;
				padding: 30px 0;
				text-align: center;
				margin-bottom: 30px;
				border-radius: 8px;
			}
			.page-header h1 {
				font-size: 32px;
				margin-bottom: 10px;
			}
			.page-header p {
				font-size: 16px;
				opacity: 0.9;
			}
			.product-section {
				margin-bottom: 40px;
			}
			.section-title {
				font-size: 24px;
				color: #333;
				margin-bottom: 20px;
				padding-bottom: 10px;
				border-bottom: 2px solid #4466aa;
			}
			.product-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 20px;
			}
			.product-card {
				background: white;
				border-radius: 8px;
				padding: 20px;
				box-shadow: 0 2px 8px rgba(0,0,0,0.1);
				transition: all 0.3s ease;
			}
			.product-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 5px 15px rgba(0,0,0,0.15);
			}
			.product-image {
				width: 100%;
				height: 280px;
				border-radius: 6px;
				margin-bottom: 15px;
				object-fit: cover;
			}
			.product-name {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 10px;
				color: #333;
			}
			.product-desc {
				font-size: 14px;
				color: #666;
				margin-bottom: 15px;
				line-height: 1.5;
			}
			.product-price {
				font-size: 22px;
				color: #4466aa;
				font-weight: bold;
			}
			.product-price span {
				font-size: 14px;
				color: #999;
				text-decoration: line-through;
				margin-left: 10px;
			}
			.promotion-banner {
				background: linear-gradient(45deg, #4466aa, #8899dd);
				color: white;
				padding: 20px;
				border-radius: 8px;
				margin-bottom: 30px;
			}
			.promotion-banner h3 {
				margin-bottom: 10px;
			}
			.btn {
				display: inline-block;
				padding: 10px 20px;
				background-color: #4466aa;
				color: white;
				text-decoration: none;
				border-radius: 4px;
				transition: background-color 0.3s ease;
			}
			.btn:hover {
				background-color: #335599;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="page-header">
				<h1>📚 图书分类</h1>
				<p>智慧阅读，知识海洋，好书相伴</p>
			</div>

			<div class="promotion-banner">
				<h3>📖 书香满溢</h3>
				<p>全场图书7折起，满200减50，满500减150！</p>
				<a href="#" class="btn">立即选购</a>
			</div>

			<div class="product-section">
				<h2 class="section-title">热门书籍</h2>
				<div class="product-grid">
					<div class="product-card">
						<img src="https://picsum.photos/seed/book1/400/500.jpg" alt="经典文学合集" class="product-image">
						<div class="product-name">经典文学合集</div>
						<div class="product-desc">收录世界名著，陶冶情操，提升修养</div>
						<div class="product-price">¥129 <span>¥189</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/seed/book2/400/500.jpg" alt="编程入门指南" class="product-image">
						<div class="product-name">编程入门指南</div>
						<div class="product-desc">零基础学编程，通俗易懂，实例丰富</div>
						<div class="product-price">¥89 <span>¥129</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/seed/book3/400/500.jpg" alt="投资理财入门" class="product-image">
						<div class="product-name">投资理财入门</div>
						<div class="product-desc">新手理财必备，实用技巧，财富增长</div>
						<div class="product-price">¥99 <span>¥149</span></div>
					</div>
					<div class="product-card">
						<img src="https://picsum.photos/seed/book4/400/500.jpg" alt="儿童绘本系列" class="product-image">
						<div class="product-name">儿童绘本系列</div>
						<div class="product-desc">色彩丰富，故事生动，培养阅读兴趣</div>
						<div class="product-price">¥69 <span>¥99</span></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
