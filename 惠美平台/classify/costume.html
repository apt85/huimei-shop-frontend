<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>服装分类 - 惠美平台</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: 'Microsoft YaHei', Arial, sans-serif;
				background-color: #f8f8f8;
				color: #333;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}
			.page-header {
				background: linear-gradient(135deg, #ff4466 0%, #ff6688 100%);
				color: white;
				padding: 30px 0;
				text-align: center;
				margin-bottom: 30px;
				border-radius: 8px;
			}
			.page-header h1 {
				font-size: 32px;
				margin-bottom: 10px;
			}
			.page-header p {
				font-size: 16px;
				opacity: 0.9;
			}
			.product-section {
				margin-bottom: 40px;
			}
			.section-title {
				font-size: 24px;
				color: #333;
				margin-bottom: 20px;
				padding-bottom: 10px;
				border-bottom: 2px solid #ff4466;
			}
			.product-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 20px;
			}
			.product-card {
				background: white;
				border-radius: 8px;
				padding: 20px;
				box-shadow: 0 2px 8px rgba(0,0,0,0.1);
				transition: all 0.3s ease;
			}
			.product-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 5px 15px rgba(0,0,0,0.15);
			}
			.product-image {
				width: 100%;
				height: 200px;
				border-radius: 6px;
				margin-bottom: 15px;
				object-fit: cover;
			}
			.product-name {
				font-size: 18px;
				font-weight: bold;
				margin-bottom: 10px;
				color: #333;
			}
			.product-desc {
				font-size: 14px;
				color: #666;
				margin-bottom: 15px;
				line-height: 1.5;
			}
			.product-price {
				font-size: 22px;
				color: #ff4466;
				font-weight: bold;
			}
			.product-price span {
				font-size: 14px;
				color: #999;
				text-decoration: line-through;
				margin-left: 10px;
			}
			.promotion-banner {
				background: linear-gradient(45deg, #ff4466, #ff8899);
				color: white;
				padding: 20px;
				border-radius: 8px;
				margin-bottom: 30px;
			}
			.promotion-banner h3 {
				margin-bottom: 10px;
			}
			.btn {
				display: inline-block;
				padding: 10px 20px;
				background-color: #ff4466;
				color: white;
				text-decoration: none;
				border-radius: 4px;
				transition: background-color 0.3s ease;
			}
			.btn:hover {
				background-color: #e63355;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="page-header">
				<h1>👚 服装分类</h1>
				<p>时尚服装，品质保证，款式多样</p>
			</div>

			<div class="promotion-banner">
				<h3>🎀 限时促销</h3>
				<p>全场服装5折起，满200减30，满300减50！</p>
				<a href="#" class="btn">立即抢购</a>
			</div>

			<div class="product-section">
				<h2 class="section-title">热门服装</h2>
				<div class="product-grid">
					<div class="product-card">
						<img src="../slideshow/images/costume_1.jpg" alt="真丝连衣裙" class="product-image">
						<div class="product-name">真丝连衣裙</div>
						<div class="product-desc">100%桑蚕丝，优雅设计，亲肤舒适</div>
						<div class="product-price">¥899 <span>¥1299</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/costume_2.jpg" alt="休闲牛仔裤" class="product-image">
						<div class="product-name">休闲牛仔裤</div>
						<div class="product-desc">弹力面料，版型时尚，百搭单品</div>
						<div class="product-price">¥299 <span>¥499</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/costume_3.jpg" alt="羊毛大衣" class="product-image">
						<div class="product-name">羊毛大衣</div>
						<div class="product-desc">100%羊毛，保暖舒适，经典款</div>
						<div class="product-price">¥1599 <span>¥2299</span></div>
					</div>
					<div class="product-card">
						<img src="../slideshow/images/costume_4.jpg" alt="针织毛衣" class="product-image">
						<div class="product-name">针织毛衣</div>
						<div class="product-desc">柔软面料，时尚设计，秋冬必备</div>
						<div class="product-price">¥399 <span>¥599</span></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
