<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能手机 - 惠美平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft Yahei", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .product-detail {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .product-header {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            padding: 30px;
            text-align: center;
        }
        .product-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .product-header p {
            font-size: 1.2em;
        }
        .product-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            padding: 30px;
        }
        .product-image {
            width: 100%;
            height: 400px;
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            padding: 20px;
        }
        .product-price {
            font-size: 2.5em;
            color: #ff4466;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .product-description {
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .product-features {
            margin-bottom: 30px;
        }
        .product-features h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .product-features ul {
            list-style: none;
            padding-left: 0;
        }
        .product-features li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .product-features li::before {
            content: "✓";
            color: #4CAF50;
            font-weight: bold;
            margin-right: 10px;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #ff4466;
            color: #fff;
            flex: 1;
        }
        .btn-primary:hover {
            background: #e03858;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        @media (max-width: 768px) {
            .product-content {
                grid-template-columns: 1fr;
            }
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="product-detail">
            <div class="product-header">
                <h1>智能手机</h1>
                <p>高性能 • 智能体验 • 时尚外观</p>
            </div>
            <div class="product-content">
                <div class="product-image">
                    <img src="../pictures/苹果17.png" alt="智能手机">
                </div>
                <div class="product-info">
                    <div class="product-price">¥7,999.00</div>
                    <div class="product-description">
                        <h3>产品描述</h3>
                        <p>最新款智能手机，搭载顶级处理器，配备高清显示屏和先进相机系统，为您带来流畅的使用体验和卓越的拍摄效果。时尚设计，轻薄机身，是您移动生活的最佳伴侣。</p>
                    </div>
                    <div class="product-features">
                        <h3>产品特点</h3>
                        <ul>
                            <li>顶级处理器，性能强劲</li>
                            <li>高清显示屏，视觉体验出色</li>
                            <li>先进相机系统，拍照更专业</li>
                            <li>大容量电池，续航持久</li>
                            <li>5G网络支持，速度更快</li>
                            <li>时尚外观设计，轻薄便携</li>
                        </ul>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary">立即购买</button>
                        <button class="btn btn-secondary">加入购物车</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
